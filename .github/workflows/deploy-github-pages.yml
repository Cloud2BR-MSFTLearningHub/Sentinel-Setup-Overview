name: Publish Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-github-pages.yml
      - docs/**
      - mkdocs.yml
      - requirements.txt
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy-github-pages.yml
      - docs/**
      - mkdocs.yml
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build documentation site
        run: mkdocs build --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-deployments:
    if: github.event_name != 'pull_request' && success()
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Retain the current and previous deployments
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 100,
              },
            );

            const orderedDeployments = deployments.sort(
              (first, second) => new Date(second.created_at) - new Date(first.created_at),
            );
            const retainedDeploymentIds = new Set(
              orderedDeployments.slice(0, 2).map((deployment) => deployment.id),
            );

            core.info(
              `Keeping ${Math.min(orderedDeployments.length, 2)} GitHub Pages deployment(s): ${[...retainedDeploymentIds].join(', ') || 'none'}.`,
            );

            for (const deployment of orderedDeployments.slice(2)) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                },
              );
              const latestStatus = statuses.sort(
                (first, second) => new Date(second.created_at) - new Date(first.created_at),
              )[0];

              if (latestStatus?.state !== 'inactive') {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  auto_inactive: false,
                  description: 'Removed by GitHub Pages deployment retention policy.',
                });
              }

              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
              });
              core.info(`Deleted older GitHub Pages deployment ${deployment.id}.`);
            }